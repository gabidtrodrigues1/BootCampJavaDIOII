spring.application.name=orcamento-api
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/orcamento?useTimezone=true&serverTimezone=UTC
spring.datasource.username=app
spring.datasource.password=app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.ai.model.chat=openai
spring.ai.openai.api-key=${OPENAI_API_KEY:chave-nao-configurada}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2

spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.prompt=Audio em portugues brasileiro com descricao de gastos financeiros. As frases geralmente contem um valor em reais, uma acao (gastei, paguei, comprei) e um local ou estabelecimento (mercado, farmacia, restaurante, loja, posto, cinema).

spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=nova
spring.ai.openai.audio.speech.options.speed=1.0
spring.ai.openai.audio.speech.options.response-format=mp3

logging.level.org.springframework.ai=INFO
