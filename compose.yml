services:
  banco:
    image: mysql:9.6
    environment:
      MYSQL_DATABASE: orcamento
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - orcamento_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["completo"]
    build: .
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://banco:3306/orcamento?useTimezone=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      banco:
        condition: service_healthy

volumes:
  orcamento_data:
